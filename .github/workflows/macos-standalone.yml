name: Standalone macOS installers

on:
  push:
    branches: [master, feature/macos-10.15-standalone]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: macOS ${{ matrix.arch }} (>= ${{ matrix.minimum }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            minimum: '10.15'
            openssl_target: darwin64-x86_64-cc
          - runner: macos-15
            arch: arm64
            minimum: '11.0'
            openssl_target: darwin64-arm64-cc
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.minimum }}
      GST_VERSION: '1.26.11'
      OPENSSL_VERSION: '3.5.8'
      LIBPLIST_VERSION: '2.6.0'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install cmake pkg-config autoconf automake libtool librsvg

      - name: Install official GStreamer universal runtime and SDK
        shell: bash
        run: |
          set -euo pipefail
          base="https://gstreamer.freedesktop.org/data/pkg/osx/$GST_VERSION"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gst-runtime.pkg" \
            "$base/gstreamer-1.0-$GST_VERSION-universal.pkg"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gst-devel.pkg" \
            "$base/gstreamer-1.0-devel-$GST_VERSION-universal.pkg"
          sudo installer -pkg "$RUNNER_TEMP/gst-runtime.pkg" -target /
          sudo installer -pkg "$RUNNER_TEMP/gst-devel.pkg" -target /
          test -d /Library/Frameworks/GStreamer.framework
          test -x /Library/Frameworks/GStreamer.framework/Commands/pkg-config

      - name: Build OpenSSL as target-specific static library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deps" "$RUNNER_TEMP/src"
          curl --fail --location --retry 3 \
            "https://www.openssl.org/source/openssl-$OPENSSL_VERSION.tar.gz" \
            -o "$RUNNER_TEMP/src/openssl.tar.gz"
          tar -xzf "$RUNNER_TEMP/src/openssl.tar.gz" -C "$RUNNER_TEMP/src"
          cd "$RUNNER_TEMP/src/openssl-$OPENSSL_VERSION"
          ./Configure "${{ matrix.openssl_target }}" \
            --prefix="$RUNNER_TEMP/deps" --openssldir="$RUNNER_TEMP/deps/ssl" \
            no-shared no-tests no-module
          make -j3 build_sw
          make install_sw
          test -f "$RUNNER_TEMP/deps/lib/libcrypto.a"

      - name: Build libplist as target-specific static library
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://codeload.github.com/libimobiledevice/libplist/tar.gz/refs/tags/$LIBPLIST_VERSION" \
            -o "$RUNNER_TEMP/src/libplist.tar.gz"
          tar -xzf "$RUNNER_TEMP/src/libplist.tar.gz" -C "$RUNNER_TEMP/src"
          cd "$RUNNER_TEMP/src/libplist-$LIBPLIST_VERSION"
          # GitHub's automatically generated tag tarballs have no .git metadata.
          printf '%s\n' "$LIBPLIST_VERSION" > .tarball-version
          ./autogen.sh --prefix="$RUNNER_TEMP/deps" --disable-shared \
            --enable-static --without-cython
          make -j3
          make install
          test -f "$RUNNER_TEMP/deps/lib/libplist-2.0.a"

      - name: Compile OpenAirX with old macOS deployment target
        shell: bash
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$RUNNER_TEMP/deps/lib/pkgconfig:/Library/Frameworks/GStreamer.framework/Libraries/pkgconfig:/Library/Frameworks/GStreamer.framework/Versions/Current/lib/pkgconfig"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.minimum }}" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/deps" \
            -DNO_MARCH_NATIVE=ON -DNO_X11_DEPS=ON \
            -DUXPLAY_MACOS_STANDALONE=ON
          cmake --build build --parallel 3
          file build/OpenAirX

      - name: Assemble DMG/PKG and audit binary dependencies
        shell: bash
        run: |
          bash scripts/macos/package-app.sh build/OpenAirX \
            "${{ matrix.arch }}" "${{ matrix.minimum }}"

      - name: Smoke-test bundled CLI and GStreamer plugins
        shell: bash
        run: |
          set -euo pipefail
          app="$PWD/dist/OpenAirX.app"
          "$app/Contents/MacOS/OpenAirX" -h > "$RUNNER_TEMP/openairx-help.txt" 2>&1
          grep -i 'OpenAirX' "$RUNNER_TEMP/openairx-help.txt"
          runtime="$app/Contents/Frameworks/GStreamer.framework/Versions/Current"
          export GST_PLUGIN_SYSTEM_PATH_1_0="$runtime/lib/gstreamer-1.0"
          export GST_PLUGIN_SCANNER="$runtime/libexec/gstreamer-1.0/gst-plugin-scanner"
          export GIO_EXTRA_MODULES="$runtime/lib/gio/modules"
          export GST_PLUGIN_PATH_1_0=""
          inspect="$runtime/bin/gst-inspect-1.0"
          test -x "$inspect"
          "$inspect" coreelements
          "$inspect" appsrc
          "$inspect" h264parse
          "$inspect" osxvideosink
          "$inspect" osxaudiosink

      - name: Verify DMG installation layout
        shell: bash
        run: |
          set -euo pipefail
          mountpoint="$RUNNER_TEMP/openairx-dmg-check"
          mkdir -p "$mountpoint"
          dmg="$PWD/dist/OpenAirX-1.74.0-macos-${{ matrix.arch }}.dmg"
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mountpoint" "$dmg"
          trap 'hdiutil detach -quiet "$mountpoint" || true' EXIT
          test -x "$mountpoint/OpenAirX.app/Contents/MacOS/OpenAirX"
          test -L "$mountpoint/Applications"
          test "$(readlink "$mountpoint/Applications")" = "/Applications"
          test -f "$mountpoint/OpenAirX.app/Contents/Info.plist"
          iconfile="$mountpoint/OpenAirX.app/Contents/Resources/OpenAirX.icns"
          test -s "$iconfile"
          mkdir -p "$RUNNER_TEMP/openairx-verified.iconset"
          iconutil --convert iconset --output "$RUNNER_TEMP/openairx-verified.iconset" "$iconfile"
          test -s "$RUNNER_TEMP/openairx-verified.iconset/icon_512x512@2x.png"
          sips -g hasAlpha "$RUNNER_TEMP/openairx-verified.iconset/icon_512x512@2x.png" | grep -F "hasAlpha: yes"
          test -s "$mountpoint/OpenAirX.app/Contents/Resources/LEGAL.md"
          test -s "$mountpoint/OpenAirX.app/Contents/Resources/THIRD_PARTY_NOTICES.md"
          test -s "$mountpoint/OpenAirX.app/Contents/Resources/Licenses/OpenSSL-Apache-2.0.txt"
          test -s "$mountpoint/OpenAirX.app/Contents/Resources/Licenses/GStreamer-LGPL-2.1.txt"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$mountpoint/OpenAirX.app/Contents/Info.plist" | grep -Fx OpenAirX.icns
          echo "DMG contains OpenAirX.app and /Applications shortcut"

      - name: Upload installable files
        uses: actions/upload-artifact@v4
        with:
          name: openairx-macos-${{ matrix.arch }}
          path: |
            dist/*.pkg
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish successful tagged-build installers
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: openairx-macos-*
          path: release
          merge-multiple: true
      - name: Export exact OpenAirX source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="release/OpenAirX-source-${GITHUB_SHA:0:12}.tar.gz" "$GITHUB_SHA"
          (cd release && sha256sum OpenAirX-source-*.tar.gz > OpenAirX-source.sha256)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.pkg
            release/*.sha256
            release/*.tar.gz
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.74.0-openairx-ci.{0}', github.run_number) }}
          name: ${{ github.ref == 'refs/heads/master' && format('OpenAirX macOS 1.74.0 - CI build {0} (unsigned)', github.run_number) || github.ref_name }}
          prerelease: ${{ github.ref == 'refs/heads/master' }}
          fail_on_unmatched_files: true
          body: |
            Self-contained Intel (macOS 10.15+) and Apple Silicon (macOS 11+) installers.
            No Homebrew, GStreamer, or developer tools are needed on the receiving Mac.
            These builds are not Apple-notarized; Gatekeeper may require Open Anyway.
            Corresponding OpenAirX source snapshot, license notices and build scripts are included.
            Based on UxPlay under GPL-3.0-or-later. See LEGAL.md and THIRD_PARTY_NOTICES.md.
            Bundled GStreamer plugins have additional per-component obligations; redistribution requires review.
            See docs/macos-standalone.md for installation and test limitations.
          generate_release_notes: true
